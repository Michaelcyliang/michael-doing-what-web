name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  schedule:
    # 台灣時間週一至週五早上 07:00 (UTC 23:00) 自動抓取最新金融數據並發布
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Dependencies
        run: pip install -r scripts/requirements.txt
      - name: Sync Live Market Data (TWSE / Frankfurter / yfinance)
        run: python3 scripts/sync_data.py --fetch-live
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install
      - name: Build Static Site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
